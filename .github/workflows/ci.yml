name: Peak CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-code-sandbox:
    name: Peak / test-code-sandbox
    runs-on: peak-ubuntu-24.04-4
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: code-sandbox/package-lock.json
      - run: npm ci
      - run: npm run build

  test-knowledge-base:
    name: Peak / test-knowledge-base
    runs-on: peak-ubuntu-24.04-4
    timeout-minutes: 30
    defaults:
      run:
        working-directory: knowledge-base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: knowledge-base/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover

  test-research-assistant:
    name: Peak / test-research-assistant
    runs-on: peak-ubuntu-24.04-4
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: research-assistant/package-lock.json
      - run: npm ci
      - run: npm run build
